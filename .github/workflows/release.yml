name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}" || {
            echo "Release tags must point to a commit on ${DEFAULT_BRANCH}." >&2
            exit 1
          }
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify versions and legal files
        id: contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib

          repository = pathlib.Path.cwd()
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit(
                  f"invalid release tag {tag!r}; use a stable SemVer tag such as v0.1.0"
              )
          version = tag[1:]

          project = tomllib.loads(
              (repository / "pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          if project.get("version") != version:
              raise SystemExit(
                  f"tag version {version!r} does not match pyproject version "
                  f"{project.get('version')!r}"
              )
          python_license = project.get("license")
          if not isinstance(python_license, (str, dict)) or not python_license:
              raise SystemExit(
                  "pyproject.toml must declare the explicitly selected project license"
              )
          if isinstance(python_license, str) and any(
              marker in python_license.upper() for marker in ("TODO", "TBD", "CHOOSE")
          ):
              raise SystemExit("pyproject.toml project.license is still a placeholder")
          if isinstance(python_license, dict):
              license_file = python_license.get("file")
              if license_file != "LICENSE":
                  raise SystemExit(
                      "pyproject.toml project.license.file must reference LICENSE"
                  )

          legal_files = {
              "LICENSE": repository / "LICENSE",
              "THIRD_PARTY_NOTICES.md": repository / "THIRD_PARTY_NOTICES.md",
          }
          for name, path in legal_files.items():
              if not path.is_file() or path.stat().st_size < 100:
                  raise SystemExit(f"{name} is missing or incomplete")
              content = path.read_text(encoding="utf-8").upper()
              if any(marker in content for marker in ("TODO", "TBD", "CHOOSE A LICENSE")):
                  raise SystemExit(f"{name} still contains a placeholder")

          required_notice_names = (
              "PYTHON",
              "PYINSTALLER",
              "ANYIO",
              "CERTIFI",
              "H11",
              "HTTPCORE",
              "HTTPX",
              "IDNA",
          )
          notices = legal_files["THIRD_PARTY_NOTICES.md"].read_text(
              encoding="utf-8"
          ).upper()
          missing_notices = [name for name in required_notice_names if name not in notices]
          if missing_notices:
              raise SystemExit(
                  "THIRD_PARTY_NOTICES.md must cover bundled components: "
                  + ", ".join(missing_notices)
              )

          package_files = sorted((repository / "npm" / "packages").glob("*/package.json"))
          if len(package_files) != 7:
              raise SystemExit(f"expected seven npm packages, found {len(package_files)}")
          package_names = set()
          npm_licenses = set()
          for path in package_files:
              package = json.loads(path.read_text(encoding="utf-8"))
              if package.get("version") != version:
                  raise SystemExit(
                      f"{path}: version {package.get('version')!r} does not match {version!r}"
                  )
              license_value = package.get("license")
              if not isinstance(license_value, str) or not license_value.strip():
                  raise SystemExit(f"{path}: an explicit npm license is required")
              if any(
                  marker in license_value.upper()
                  for marker in ("TODO", "TBD", "CHOOSE")
              ):
                  raise SystemExit(f"{path}: license is still a placeholder")
              npm_licenses.add(license_value)
              package_names.add(package["name"])
          if len(npm_licenses) != 1:
              raise SystemExit("all seven npm packages must use the same license value")

          meta = json.loads(
              (repository / "npm" / "packages" / "cli" / "package.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_platforms = package_names - {"@api429/cli"}
          optional = meta.get("optionalDependencies")
          if not isinstance(optional, dict) or set(optional) != expected_platforms:
              raise SystemExit(
                  "@api429/cli optionalDependencies must name all six platform packages"
              )
          if set(optional.values()) != {version}:
              raise SystemExit(
                  "@api429/cli must pin every platform package to the release version"
              )

          workspace = json.loads(
              (repository / "npm" / "package.json").read_text(encoding="utf-8")
          )
          if workspace.get("version") != version:
              raise SystemExit("npm workspace version does not match the release version")

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")
          PY
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          npm ci --ignore-scripts --prefix npm
      - name: Run source checks
        run: |
          ruff check .
          ruff format --check .
          mypy --strict src scripts
          pytest
          npm run --prefix npm check

  python-distributions:
    name: Build Python distributions
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1,<2' 'twine>=5,<7'
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-install wheel
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          test "$(.release-smoke/bin/api429 --version)" = "api429 ${RELEASE_VERSION}"
      - name: Attest Python distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  standalone:
    name: Standalone ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONHASHSEED: "0"
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            architecture: x64
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            architecture: arm64
          - target: darwin-x64
            runner: macos-15-intel
            architecture: x64
          - target: darwin-arm64
            runner: macos-15
            architecture: arm64
          - target: win32-x64
            runner: windows-2025
            architecture: x64
          - target: win32-arm64
            runner: windows-11-vs2026-arm
            architecture: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.13"
          architecture: ${{ matrix.architecture }}
      - name: Install standalone build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install -r scripts/requirements-standalone.txt
      - name: Build and verify native executable
        run: python scripts/build_standalone.py --output-dir dist/standalone
      - name: Attest native artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/standalone/*
      - name: Upload native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-${{ matrix.target }}
          path: dist/standalone/*
          if-no-files-found: error
          retention-days: 30

  npm-distributions:
    name: Build npm distributions
    needs: [preflight, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download native artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: standalone-*
          path: dist/standalone
          merge-multiple: true
      - name: Verify and stage native payloads
        run: python scripts/stage_npm_binaries.py --artifacts-dir dist/standalone
      - name: Install npm workspace
        working-directory: npm
        run: npm ci --ignore-scripts
      - name: Build npm tarballs
        working-directory: npm
        run: |
          npm run check
          mkdir -p ../dist/npm
          npm run --silent pack:release -- ../dist/npm > ../dist/npm/npm-manifest.json
      - name: Smoke-install npm tarballs
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          npm install --ignore-scripts --no-save --prefix dist/npm-smoke \
            "$(pwd)/dist/npm/api429-cli-${RELEASE_VERSION}.tgz" \
            "$(pwd)/dist/npm/api429-cli-linux-x64-gnu-${RELEASE_VERSION}.tgz"
          test "$(dist/npm-smoke/node_modules/.bin/api429 --version)" = \
            "api429 ${RELEASE_VERSION}"
      - name: Attest npm distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/npm/*
      - name: Upload npm distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-distributions
          path: dist/npm/
          if-no-files-found: error
          retention-days: 30

  release-bundle:
    name: Assemble and attest release
    needs: [preflight, python-distributions, standalone, npm-distributions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out legal files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            LICENSE
            THIRD_PARTY_NOTICES.md
          sparse-checkout-cone-mode: false
      - name: Download Python distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-distributions
          path: release
      - name: Download native artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: standalone-*
          path: release
          merge-multiple: true
      - name: Download npm distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-distributions
          path: release
      - name: Verify the complete artifact set
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md release/
          python - <<'PY'
          import json
          import os
          import pathlib

          version = os.environ["RELEASE_VERSION"]
          release = pathlib.Path("release")
          targets = (
              "darwin-arm64",
              "darwin-x64",
              "linux-arm64",
              "linux-x64",
              "win32-arm64",
              "win32-x64",
          )
          expected = {"LICENSE", "THIRD_PARTY_NOTICES.md", "npm-manifest.json"}
          expected.update(
              {
                  f"api429-v{version}-{target}{'.zip' if target.startswith('win32') else '.tar.gz'}"
                  for target in targets
              }
          )
          expected.update(
              {
                  f"api429-v{version}-{target}{'.zip' if target.startswith('win32') else '.tar.gz'}.sha256"
                  for target in targets
              }
          )
          expected.update({f"api429-v{version}-{target}.json" for target in targets})
          expected.update(
              {
                  f"api429-cli-{suffix}-{version}.tgz"
                  for suffix in (
                      "darwin-arm64",
                      "darwin-x64",
                      "linux-arm64-gnu",
                      "linux-x64-gnu",
                      "win32-arm64",
                      "win32-x64",
                  )
              }
          )
          expected.add(f"api429-cli-{version}.tgz")

          wheels = list(release.glob("api429_cli-*.whl"))
          sdists = list(release.glob("api429_cli-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("expected exactly one Python wheel and one sdist")
          expected.update({wheels[0].name, sdists[0].name})

          actual = {path.name for path in release.iterdir() if path.is_file()}
          if actual != expected:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              raise SystemExit(f"release artifact mismatch; missing={missing}, extra={extra}")

          npm_manifest = json.loads(
              (release / "npm-manifest.json").read_text(encoding="utf-8")
          )
          if npm_manifest.get("version") != version:
              raise SystemExit("npm manifest version does not match the release")
          packages = npm_manifest.get("packages")
          if not isinstance(packages, list) or len(packages) != 7:
              raise SystemExit("npm manifest must describe exactly seven packages")
          manifest_tarballs = {pathlib.Path(item["tarball"]).name for item in packages}
          expected_tarballs = {name for name in expected if name.endswith(".tgz")}
          if manifest_tarballs != expected_tarballs:
              raise SystemExit("npm manifest tarballs do not match the release bundle")

          for target in targets:
              manifest = json.loads(
                  (release / f"api429-v{version}-{target}.json").read_text(
                      encoding="utf-8"
                  )
              )
              if manifest.get("version") != version or manifest.get("target") != target:
                  raise SystemExit(f"invalid standalone manifest for {target}")
          PY
      - name: Create deterministic checksums
        run: |
          python - <<'PY'
          import hashlib
          import pathlib

          release = pathlib.Path("release")
          lines = []
          for path in sorted(release.iterdir(), key=lambda item: item.name):
              if not path.is_file() or path.name == "SHA256SUMS":
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}\n")
          (release / "SHA256SUMS").write_text("".join(lines), encoding="ascii")
          PY
      - name: Generate release provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*
      - name: Add provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" release/PROVENANCE.intoto.jsonl
      - name: Upload complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish-npm:
    name: Publish npm packages
    needs: [preflight, npm-distributions, release-bundle]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@api429/cli
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require completed npm OIDC bootstrap
        env:
          NPM_OIDC_READY: ${{ vars.NPM_OIDC_READY }}
        run: |
          if [ "${NPM_OIDC_READY}" != "true" ]; then
            echo "npm publishing is locked." >&2
            echo "First publish all seven packages with account 2FA, configure release.yml" >&2
            echo "as the trusted publisher for every package, then set the npm environment" >&2
            echo "variable NPM_OIDC_READY=true." >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require an OIDC-capable npm CLI
        run: |
          NPM_VERSION="$(npm --version)" \
          node -e '
            const version = process.env.NPM_VERSION.match(/^(\d+)\.(\d+)\.(\d+)/);
            const tooOld = version && (
              Number(version[1]) < 11 ||
              (Number(version[1]) === 11 && Number(version[2]) < 5) ||
              (Number(version[1]) === 11 && Number(version[2]) === 5 && Number(version[3]) < 1)
            );
            if (!version || tooOld) {
              throw new Error(`npm 11.5.1 or newer is required, got ${process.env.NPM_VERSION}`);
            }
          '
      - name: Download npm distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-distributions
          path: dist
      - name: Publish platform packages, then the CLI package
        env:
          NPM_CONFIG_PROVENANCE: "true"
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          publish_or_verify() {
            local package_name="$1"
            local tarball="$2"
            local remote_integrity=""
            remote_integrity="$(npm view "${package_name}@${RELEASE_VERSION}" dist.integrity 2>/dev/null || true)"
            if [ -n "${remote_integrity}" ]; then
              local local_integrity
              local_integrity="$(node -e '
                const crypto = require("node:crypto");
                const fs = require("node:fs");
                const file = process.argv[1];
                process.stdout.write("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(file)).digest("base64"));
              ' "${tarball}")"
              if [ "${remote_integrity}" != "${local_integrity}" ]; then
                echo "${package_name}@${RELEASE_VERSION} exists with different content" >&2
                exit 1
              fi
              echo "Verified existing ${package_name}@${RELEASE_VERSION}"
              return
            fi
            npm publish "${tarball}" --access public
          }

          publish_or_verify "@api429/cli-darwin-arm64" \
            "dist/api429-cli-darwin-arm64-${RELEASE_VERSION}.tgz"
          publish_or_verify "@api429/cli-darwin-x64" \
            "dist/api429-cli-darwin-x64-${RELEASE_VERSION}.tgz"
          publish_or_verify "@api429/cli-linux-arm64-gnu" \
            "dist/api429-cli-linux-arm64-gnu-${RELEASE_VERSION}.tgz"
          publish_or_verify "@api429/cli-linux-x64-gnu" \
            "dist/api429-cli-linux-x64-gnu-${RELEASE_VERSION}.tgz"
          publish_or_verify "@api429/cli-win32-arm64" \
            "dist/api429-cli-win32-arm64-${RELEASE_VERSION}.tgz"
          publish_or_verify "@api429/cli-win32-x64" \
            "dist/api429-cli-win32-x64-${RELEASE_VERSION}.tgz"
          publish_or_verify "@api429/cli" \
            "dist/api429-cli-${RELEASE_VERSION}.tgz"

  publish-pypi:
    name: Publish to PyPI
    needs: [python-distributions, publish-npm]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/api429-cli
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-distributions
          path: dist
      - name: Publish Python distributions with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-github:
    name: Publish GitHub release
    needs: [preflight, release-bundle, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download complete release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-bundle
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --notes "Artifacts are covered by the attached PROVENANCE.intoto.jsonl bundle and can also be verified with GitHub artifact attestations. Verify file hashes with SHA256SUMS." \
            --title "API429 CLI ${RELEASE_VERSION}"
