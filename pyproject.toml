[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api429-cli"
version = "0.1.0"
description = "Official command-line client for the API429 gateway"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "API429" },
]
keywords = ["api429", "ai", "cli", "image-generation", "video-generation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://api429.com"
Documentation = "https://client.api429.com/documentation"
Repository = "https://github.com/veresk06/api429-cli"
Issues = "https://github.com/veresk06/api429-cli/issues"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]
dev = [
  "build>=1,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
api429 = "api429_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["api429_cli*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = ["PYI034", "TRY004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
strict = true
